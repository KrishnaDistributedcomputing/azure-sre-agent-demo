[project]
name = "azure-sre-agent-demo"
version = "0.1.0"
description = "Low-cost Azure SRE Agent evaluation with ten deterministic incident scenarios."
requires-python = ">=3.11,<3.15"
dependencies = [
    "azure-functions==1.24.0",
    "azure-storage-queue==12.14.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.0",
    "ipywidgets>=8.1.0",
    "pytest>=8.4.0",
    "ruff>=0.14.0",
    "tqdm>=4.67.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
